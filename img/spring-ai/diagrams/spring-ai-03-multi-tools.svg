<text x="99" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">1</text>
<text x="125" y="287" font-size="25" font-weight="700" fill="#102033">识别任务</text>
<path d="M 252 316 H 258" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
<path d="M 258 316 l -12 -8 v16 z" fill="#16a34a"/>
<rect x="269" y="245" width="178" height="142" rx="18" fill="#eef6ff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="301" cy="279" r="15" fill="#16a34a"/>
<text x="301" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
<text x="327" y="287" font-size="25" font-weight="700" fill="#102033">拆分调用</text>
<path d="M 454 316 H 460" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
<path d="M 460 316 l -12 -8 v16 z" fill="#16a34a"/>

<text x="907" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">5</text>
<text x="933" y="287" font-size="25" font-weight="700" fill="#102033">最终回答</text>
<rect x="70" y="475" width="980" height="62" rx="16" fill="#f1f5f9"/>
<text x="92" y="514" font-size="23" fill="#102033">多工具场景要关注调用次数、超时和失败兜底。</text>

<circle cx="503" cy="279" r="15" fill="#16a34a"/>
<text x="503" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
<text x="529" y="287" font-size="25" font-weight="700" fill="#102033">并行/串行</text>
<path d="M 656 316 H 662" stroke="#16a34a" stroke-width="4" stroke-linecap="round"/>
<path d="M 662 316 l -12 -8 v16 z" fill="#16a34a"/>
<rect x="673" y="245" width="178" height="142" rx="18" fill="#eef6ff" stroke="#cbd5e1" stroke-width="2"/>

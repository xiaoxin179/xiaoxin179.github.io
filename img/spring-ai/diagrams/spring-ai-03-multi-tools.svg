<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="630" viewBox="0 0 1120 630">
<rect width="1120" height="630" fill="#f8fafc"/>
<rect x="34" y="34" width="1052" height="562" rx="26" fill="#ffffff" stroke="#d7dee8" stroke-width="2"/>

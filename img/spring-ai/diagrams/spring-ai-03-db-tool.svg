<text x="611" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">3</text>
<text x="637" y="287" font-size="25" font-weight="700" fill="#102033">白名单参数</text>
<path d="M 806 316 H 826" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<path d="M 826 316 l -12 -8 v16 z" fill="#2563eb"/>
<rect x="837" y="245" width="220" height="142" rx="18" fill="#eef6ff" stroke="#cbd5e1" stroke-width="2"/>

<text x="121" y="287" font-size="25" font-weight="700" fill="#102033">Repository</text>
<path d="M 290 316 H 310" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<path d="M 310 316 l -12 -8 v16 z" fill="#2563eb"/>
<rect x="321" y="245" width="220" height="142" rx="18" fill="#eef6ff" stroke="#cbd5e1" stroke-width="2"/>
<circle cx="353" cy="279" r="15" fill="#2563eb"/>
<text x="353" y="286" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">2</text>
<text x="379" y="287" font-size="25" font-weight="700" fill="#102033">Tool 方法</text>
<path d="M 548 316 H 568" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
<path d="M 568 316 l -12 -8 v16 z" fill="#2563eb"/>
<rect x="579" y="245" width="220" height="142" rx="18" fill="#eef6ff" stroke="#cbd5e1" stroke-width="2"/>
